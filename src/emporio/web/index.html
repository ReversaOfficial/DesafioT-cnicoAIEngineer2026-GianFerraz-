<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música — Atendimento</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#11100e">
<meta name="description" content="Agente de atendimento da Empório da Música, loja de instrumentos de Campo Grande/MS. Consulta catálogo, preço, frete, pedidos e o manual de políticas antes de responder.">
<!-- Compartilhamento: a URL da imagem precisa ser absoluta para os
     raspadores de link (WhatsApp, LinkedIn, Slack) conseguirem buscá-la. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Empório da Música">
<meta property="og:title" content="Téo — atendimento da Empório da Música">
<meta property="og:description" content="Agente de atendimento da Empório da Música, loja de instrumentos de Campo Grande/MS. Consulta catálogo, preço, frete, pedidos e o manual de políticas antes de responder.">
<meta property="og:image" content="https://emporio-da-musica-six.vercel.app/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="628">
<meta property="og:url" content="https://emporio-da-musica-six.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* Paleta de loja de instrumentos: madeira, âmbar e grafite. */
  :root {
    --bg: #11100e;
    --panel: #1b1a17;
    --panel-2: #232118;
    --line: #322e26;
    --text: #efe9df;
    --muted: #a29a8c;
    --amber: #d99b2b;
    --amber-soft: #3a2d14;
    --client: #2f4b3f;
    --client-text: #e8f3ec;
    /* Tudo que antes estava escrito à mão virou variável, senão o tema claro
       precisaria duplicar regra em vez de só trocar valor. */
    --brilho: #241f16;
    --sombra: 0 30px 70px rgba(0,0,0,.5);
    --topo: linear-gradient(180deg, #211e18, #1b1a17);
    --online: #5fa777;
    --offline: #b4524a;
    --linha-hover: #4a4337;
    --sobre-amber: #1a1510;
    --barra: #3b352b;
    --sys-linha: #4b3f28;
    --trace-linha: #4d3c18;
    --trace-texto: #e2c489;
    --trace-meta: #a4906a;
    --chip-bg: #221f19;
    --form-bg: #171611;
    --input-bg: #221f19;
    --rodape: #6f6859;
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Tema claro. O escuro continua sendo o default do documento; aqui só os
     valores que mudam. O âmbar escurece porque #d99b2b sobre branco não
     alcança contraste suficiente para leitura. */
  :root[data-tema="light"] {
    --bg: #f3efe7;
    --panel: #ffffff;
    --panel-2: #f5f1e9;
    --line: #e2dcd0;
    --text: #1b1915;
    --muted: #6b6457;
    --amber: #9c6713;
    --amber-soft: #fdf3e0;
    --client-text: #eef7f1;
    --brilho: #ffffff;
    --sombra: 0 18px 44px rgba(60, 50, 30, .13);
    --topo: linear-gradient(180deg, #fffdf8, #f7f3ea);
    --online: #2f7a4b;
    --offline: #a8392f;
    --linha-hover: #c9c0ad;
    --sobre-amber: #fffaf0;
    --barra: #ccc4b4;
    --sys-linha: #d9cdb2;
    --trace-linha: #e7d3a6;
    --trace-texto: #6d4b0d;
    --trace-meta: #8a7a5c;
    --chip-bg: #f7f3ea;
    --form-bg: #f7f4ed;
    --input-bg: #ffffff;
    --rodape: #8a8275;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1100px 500px at 15% -10%, var(--brilho) 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: min(880px, calc(100vh - 40px));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--sombra);
  }

  /* ---------- cabeçalho ---------- */
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 13px 8px;
    padding: 15px 18px;
    background: var(--topo);
    border-bottom: 1px solid var(--line);
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    /* A arte já é um selo circular sobre fundo preto; o border-radius recorta
       os cantos quadrados do PNG e dispensa versão com transparência. */
    object-fit: cover;
    flex-shrink: 0;
  }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 15px; letter-spacing: .2px; }
  .who span { font-size: 12.5px; color: var(--muted); }
  .dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--online); margin-right: 5px;
  }
  .dot.off { background: var(--offline); }
  .hbtn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit; font-size: 12px;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .hbtn:hover { color: var(--text); border-color: var(--linha-hover); }
  a.hbtn { text-decoration: none; display: inline-block; }
  .hbtn.on { color: var(--sobre-amber); background: var(--amber); border-color: var(--amber); }

  /* ---------- conversa ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--barra) transparent;
  }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 76%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .22s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(5px); } }
  .row.them .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
  }
  .row.me .bubble {
    background: var(--client);
    color: var(--client-text);
    border-bottom-right-radius: 5px;
  }
  .row.sys { justify-content: center; }
  .row.sys .bubble {
    background: transparent;
    border: 1px dashed var(--sys-linha);
    color: var(--muted);
    font-size: 12.5px;
    max-width: 90%;
  }

  /* ---------- trace de ferramentas ---------- */
  .trace {
    align-self: flex-start;
    max-width: 76%;
    margin: -4px 0 2px;
    padding: 8px 11px;
    background: var(--amber-soft);
    border: 1px solid var(--trace-linha);
    border-radius: 10px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--trace-texto);
  }
  .trace b { color: var(--amber); font-weight: 600; }
  .trace .meta { color: var(--trace-meta); }

  /* ---------- digitando ---------- */
  .typing { display: flex; gap: 4px; padding: 13px 15px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); animation: blink 1.3s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }

  /* ---------- sugestões ---------- */
  .chips {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 4px 18px 12px;
  }
  .chip {
    background: var(--chip-bg);
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit; font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    text-align: left;
  }
  .chip:hover { color: var(--text); border-color: var(--amber); }

  /* ---------- composer ---------- */
  form {
    display: flex; gap: 9px;
    padding: 13px 15px;
    background: var(--form-bg);
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 120px;
    background: var(--input-bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font: inherit; font-size: 14.5px;
    padding: 11px 13px;
    outline: none;
  }
  textarea:focus { border-color: var(--amber); }
  button.send {
    width: 44px; flex-shrink: 0;
    border: none; border-radius: 12px;
    background: var(--amber);
    color: var(--sobre-amber);
    font-size: 17px;
    cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  footer {
    padding: 8px 18px 13px;
    font-size: 11px;
    color: var(--rodape);
    text-align: center;
  }
  @media (max-width: 600px) {
    body { padding: 0; }
    .app { height: 100vh; border-radius: 0; border: none; }
    .bubble, .trace { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="avatar" src="/assets/logo.png" alt="Logotipo da Empório da Música" width="42" height="42">
    <div class="who">
      <b>Téo &middot; Empório da Música</b>
      <span id="status"><span class="dot off"></span>conectando…</span>
    </div>
    <button class="hbtn" id="btn-trace" title="Mostra quais consultas o agente fez">consultas</button>
    <button class="hbtn" id="btn-reset" title="Começa uma conversa nova">nova</button>
    <a class="hbtn" href="/ferramentas" id="lnk-ferramentas" title="Roda as 11 ferramentas sem LLM, sem cota">ferramentas</a>
    <button class="hbtn" id="btn-idioma" title="Switch the interface to English">EN</button>
    <button class="hbtn" id="btn-tema" title="Alterna entre tema claro e escuro">☀</button>
  </header>

  <div class="chat" id="chat"></div>
  <div class="chips" id="chips"></div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Escreva sua mensagem…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Enviar">➤</button>
  </form>
  <footer id="rodape">Assistente virtual · Rua 14 de Maio, 3200 — Centro, Campo Grande/MS · (67) 3341-4444</footer>
</div>

<script>
const chat    = document.getElementById('chat');
const form    = document.getElementById('form');
const input   = document.getElementById('input');
const sendBtn = document.getElementById('send');
const chips   = document.getElementById('chips');
const statusEl= document.getElementById('status');
const btnTrace= document.getElementById('btn-trace');
const btnReset= document.getElementById('btn-reset');
const btnIdioma = document.getElementById('btn-idioma');
const btnTema   = document.getElementById('btn-tema');
const lnkFerr   = document.getElementById('lnk-ferramentas');
const rodapeEl  = document.getElementById('rodape');

// A sessão fica no sessionStorage: recarregar a página não perde a conversa,
// e o histórico vive no servidor de todo modo.
let sessionId = sessionStorage.getItem('emporio_session') || null;
let showTrace = localStorage.getItem('emporio_trace') === '1';
// Idioma e tema sobrevivem ao recarregamento, mas ficam no navegador de quem
// visita: nao sao estado do servidor nem entram na conversa persistida.
let idioma = localStorage.getItem('emporio_idioma') === 'en' ? 'en' : 'pt';
let tema   = localStorage.getItem('emporio_tema') === 'light' ? 'light' : 'dark';
let busy = false;

const TEXTOS = {
  pt: {
    lang: 'pt-BR',
    trace: 'consultas',      traceTitulo: 'Mostra quais consultas o agente fez',
    reset: 'nova',           resetTitulo: 'Começa uma conversa nova',
    ferramentas: 'ferramentas', ferrTitulo: 'Roda as 11 ferramentas sem LLM, sem cota',
    idiomaRotulo: 'EN',      idiomaTitulo: 'Switch the interface to English',
    temaTitulo: 'Alterna entre tema claro e escuro',
    placeholder: 'Escreva sua mensagem…',
    enviarAria: 'Enviar',
    rodape: 'Assistente virtual · Rua 14 de Maio, 3200 — Centro, Campo Grande/MS · (67) 3341-4444',
    conectando: 'conectando…',
    online: 'online',
    semConfig: 'configuração incompleta',
    semServidor: 'servidor indisponível',
    semChave: 'O agente de conversa está sem chave de API configurada. '
      + 'Rodando local, preencha GEMINI_API_KEY no .env e reinicie. '
      + 'De todo modo, a camada determinística não depende de modelo: '
      + 'abra /ferramentas para consultar preço, frete, prazo e políticas '
      + 'sobre os dados reais da loja.',
    semDados: 'Os dados ainda não foram carregados. Rode: emporio build',
    atalho: '→ abrir a camada determinística',
    semRede: 'Não consegui falar com o servidor. Ele ainda está rodando?',
    falhaHttp: (st) => `Falha na requisição (HTTP ${st}).`,
    sugestoes: [
      'Quais violões vocês têm até R$ 1.000?',
      'Quanto custa o Takamine GD20?',
      'Qual o endereço da loja?',
      'Me arrependi da compra, posso devolver o pedido 7?',
      'Tem alguma promoção rolando?',
      'Vocês vendem cordas e palhetas?'
    ]
  },
  en: {
    lang: 'en',
    trace: 'lookups',        traceTitulo: 'Shows which tools the agent queried',
    reset: 'new',            resetTitulo: 'Starts a new conversation',
    ferramentas: 'tools',    ferrTitulo: 'Runs the 11 tools with no LLM and no quota',
    idiomaRotulo: 'PT',      idiomaTitulo: 'Mudar a interface para português',
    temaTitulo: 'Toggle between light and dark theme',
    placeholder: 'Write your message…',
    enviarAria: 'Send',
    rodape: 'Virtual assistant · Rua 14 de Maio, 3200 — Centro, Campo Grande/MS · +55 67 3341-4444',
    conectando: 'connecting…',
    online: 'online',
    semConfig: 'incomplete configuration',
    semServidor: 'server unavailable',
    semChave: 'The conversational agent has no API key configured. '
      + 'Running locally, fill in GEMINI_API_KEY in your .env and restart. '
      + 'Either way, the deterministic layer needs no model: '
      + 'open /ferramentas to check prices, shipping, deadlines and policies '
      + 'against the store\'s real data.',
    semDados: 'Data has not been loaded yet. Run: emporio build',
    atalho: '→ open the deterministic layer',
    semRede: 'I could not reach the server. Is it still running?',
    falhaHttp: (st) => `Request failed (HTTP ${st}).`,
    sugestoes: [
      'Which acoustic guitars do you have under R$ 1,000?',
      'How much is the Takamine GD20?',
      "What is the store's address?",
      'I changed my mind, can I return order 7?',
      'Any promotions running?',
      'Do you sell strings and picks?'
    ]
  }
};
const T = () => TEXTOS[idioma];



function syncTraceButton() {
  btnTrace.classList.toggle('on', showTrace);
}

// O modelo escreve com ênfase leve em markdown (`**assim**`), que é natural
// num canal de mensagem. Convertemos apenas negrito e itálico — SEMPRE depois
// de escapar o HTML, para que nada vindo do modelo ou do cliente possa injetar
// marcação na página.
function escapeHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

function formatarMensagem(texto) {
  return escapeHtml(texto)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*(?!\s)([^*\n]+?)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
}

function addBubble(text, kind) {
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatarMensagem(text);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function addTrace(trace) {
  if (!trace || !trace.length) return;
  const box = document.createElement('div');
  box.className = 'trace';
  box.innerHTML = trace.map(t => {
    const args = Object.entries(t.argumentos || {})
      .map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ');
    const mark = t.ok ? '✓' : '✗';
    return `${mark} <b>${t.ferramenta}</b>(${args}) <span class="meta">${t.duracao_ms}ms</span>`;
  }).join('<br>');
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row them';
  row.id = 'typing';
  row.innerHTML = '<div class="bubble typing"><i></i><i></i><i></i></div>';
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() {
  document.getElementById('typing')?.remove();
}

function renderChips() {
  chips.innerHTML = '';
  T().sugestoes.forEach(texto => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = texto;
    b.onclick = () => { input.value = texto; form.requestSubmit(); };
    chips.appendChild(b);
  });
}

async function boot() {
  try {
    const health = await fetch('/api/health').then(r => r.json());
    const ok = health.status === 'ok';
    statusEl.innerHTML =
      `<span class="dot ${ok ? '' : 'off'}"></span>` +
      (ok ? `${T().online} · ${health.llm.modelo}` : T().semConfig);
    if (!ok) {
      // A mensagem precisa servir aos dois contextos: quem rodou local
      // esqueceu o .env, e quem abriu o site hospedado pegou a cota ou a
      // configuração incompleta. Em qualquer um dos casos, a camada
      // determinística continua de pé — então aponta para ela em vez de
      // deixar a pessoa numa tela morta.
      addBubble(health.llm.chave_configurada ? T().semDados : T().semChave, 'sys');
      const atalho = addBubble('', 'sys');
      atalho.querySelector('.bubble').innerHTML =
        `<a href="/ferramentas" style="color:var(--amber)">${T().atalho}</a>`;
      return;
    }
  } catch {
    statusEl.innerHTML = `<span class="dot off"></span>${T().semServidor}`;
    return;
  }

  const saudacao = await fetch(`/api/saudacao?idioma=${idioma}`).then(r => r.json());
  addBubble(saudacao.mensagem, 'them');
  renderChips();
  input.focus();
}

async function enviar(texto) {
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  chips.innerHTML = '';
  addBubble(texto, 'me');
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mensagem: texto,
        session_id: sessionId,
        idioma: idioma,
        incluir_trace: showTrace
      })
    });
    hideTyping();
    if (!res.ok) {
      const erro = await res.json().catch(() => ({}));
      addBubble(erro.detail || T().falhaHttp(res.status), 'sys');
      return;
    }
    const data = await res.json();
    sessionId = data.session_id;
    sessionStorage.setItem('emporio_session', sessionId);
    if (showTrace) addTrace(data.trace);
    addBubble(data.resposta, 'them');
  } catch (e) {
    hideTyping();
    addBubble(T().semRede, 'sys');
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const texto = input.value.trim();
  if (!texto) return;
  input.value = '';
  input.style.height = 'auto';
  enviar(texto);
});

// Enter envia, Shift+Enter quebra linha — convenção de app de mensagem.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

btnTrace.addEventListener('click', () => {
  showTrace = !showTrace;
  localStorage.setItem('emporio_trace', showTrace ? '1' : '0');
  syncTraceButton();
});

btnReset.addEventListener('click', () => {
  sessionId = null;
  sessionStorage.removeItem('emporio_session');
  chat.innerHTML = '';
  boot();
});

function aplicarTema() {
  document.documentElement.dataset.tema = tema;
  btnTema.textContent = tema === 'dark' ? '☀' : '☾';
  // A cor da barra do navegador em mobile acompanha o tema.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', tema === 'dark' ? '#11100e' : '#f3efe7');
}

function aplicarIdioma() {
  const t = T();
  document.documentElement.lang = t.lang;
  btnTrace.textContent = t.trace;        btnTrace.title = t.traceTitulo;
  btnReset.textContent = t.reset;        btnReset.title = t.resetTitulo;
  lnkFerr.textContent = t.ferramentas;   lnkFerr.title = t.ferrTitulo;
  btnIdioma.textContent = t.idiomaRotulo; btnIdioma.title = t.idiomaTitulo;
  btnTema.title = t.temaTitulo;
  input.placeholder = t.placeholder;
  sendBtn.setAttribute('aria-label', t.enviarAria);
  rodapeEl.textContent = t.rodape;
  if (chips.children.length) renderChips();
}

btnTema.addEventListener('click', () => {
  tema = tema === 'dark' ? 'light' : 'dark';
  localStorage.setItem('emporio_tema', tema);
  aplicarTema();
});

btnIdioma.addEventListener('click', () => {
  idioma = idioma === 'pt' ? 'en' : 'pt';
  localStorage.setItem('emporio_idioma', idioma);
  aplicarIdioma();
  // As falas já ditas ficam como foram ditas: reescrevê-las seria inventar um
  // histórico que não aconteceu. Mas se a conversa ainda não começou, a
  // saudação é recarregada no idioma novo — e dali em diante o agente responde
  // nele, porque o idioma vai junto de cada requisição.
  const jaFalou = chat.querySelector('.row.me');
  if (!jaFalou) { chat.innerHTML = ''; boot(); }
});
