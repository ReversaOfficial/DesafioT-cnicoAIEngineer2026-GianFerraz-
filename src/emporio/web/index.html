<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música — Atendimento</title>
<style>
  /* Paleta de loja de instrumentos: madeira, âmbar e grafite. */
  :root {
    --bg: #11100e;
    --panel: #1b1a17;
    --panel-2: #232118;
    --line: #322e26;
    --text: #efe9df;
    --muted: #a29a8c;
    --amber: #d99b2b;
    --amber-soft: #3a2d14;
    --client: #2f4b3f;
    --client-text: #e8f3ec;
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1100px 500px at 15% -10%, #241f16 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: min(880px, calc(100vh - 40px));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
  }

  /* ---------- cabeçalho ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px 18px;
    background: linear-gradient(180deg, #211e18, #1b1a17);
    border-bottom: 1px solid var(--line);
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--amber), #a3691a);
    display: grid; place-items: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 15px; letter-spacing: .2px; }
  .who span { font-size: 12.5px; color: var(--muted); }
  .dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: #5fa777; margin-right: 5px;
  }
  .dot.off { background: #b4524a; }
  .hbtn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit; font-size: 12px;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .hbtn:hover { color: var(--text); border-color: #4a4337; }
  .hbtn.on { color: #1a1510; background: var(--amber); border-color: var(--amber); }

  /* ---------- conversa ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #3b352b transparent;
  }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 76%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .22s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(5px); } }
  .row.them .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
  }
  .row.me .bubble {
    background: var(--client);
    color: var(--client-text);
    border-bottom-right-radius: 5px;
  }
  .row.sys { justify-content: center; }
  .row.sys .bubble {
    background: transparent;
    border: 1px dashed #4b3f28;
    color: var(--muted);
    font-size: 12.5px;
    max-width: 90%;
  }

  /* ---------- trace de ferramentas ---------- */
  .trace {
    align-self: flex-start;
    max-width: 76%;
    margin: -4px 0 2px;
    padding: 8px 11px;
    background: var(--amber-soft);
    border: 1px solid #4d3c18;
    border-radius: 10px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #e2c489;
  }
  .trace b { color: var(--amber); font-weight: 600; }
  .trace .meta { color: #a4906a; }

  /* ---------- digitando ---------- */
  .typing { display: flex; gap: 4px; padding: 13px 15px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); animation: blink 1.3s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }

  /* ---------- sugestões ---------- */
  .chips {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 4px 18px 12px;
  }
  .chip {
    background: #221f19;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit; font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    text-align: left;
  }
  .chip:hover { color: var(--text); border-color: var(--amber); }

  /* ---------- composer ---------- */
  form {
    display: flex; gap: 9px;
    padding: 13px 15px;
    background: #171611;
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 120px;
    background: #221f19;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font: inherit; font-size: 14.5px;
    padding: 11px 13px;
    outline: none;
  }
  textarea:focus { border-color: var(--amber); }
  button.send {
    width: 44px; flex-shrink: 0;
    border: none; border-radius: 12px;
    background: var(--amber);
    color: #1a1510;
    font-size: 17px;
    cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  footer {
    padding: 8px 18px 13px;
    font-size: 11px;
    color: #6f6859;
    text-align: center;
  }
  @media (max-width: 600px) {
    body { padding: 0; }
    .app { height: 100vh; border-radius: 0; border: none; }
    .bubble, .trace { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🎸</div>
    <div class="who">
      <b>Téo &middot; Empório da Música</b>
      <span id="status"><span class="dot off"></span>conectando…</span>
    </div>
    <button class="hbtn" id="btn-trace" title="Mostra quais consultas o agente fez">consultas</button>
    <button class="hbtn" id="btn-reset" title="Começa uma conversa nova">nova</button>
  </header>

  <div class="chat" id="chat"></div>
  <div class="chips" id="chips"></div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Escreva sua mensagem…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Enviar">➤</button>
  </form>
  <footer>Assistente virtual · Rua 14 de Maio, 3200 — Centro, Campo Grande/MS · (67) 3341-4444</footer>
</div>

<script>
const chat    = document.getElementById('chat');
const form    = document.getElementById('form');
const input   = document.getElementById('input');
const sendBtn = document.getElementById('send');
const chips   = document.getElementById('chips');
const statusEl= document.getElementById('status');
const btnTrace= document.getElementById('btn-trace');
const btnReset= document.getElementById('btn-reset');

// A sessão fica no sessionStorage: recarregar a página não perde a conversa,
// e o histórico vive no servidor de todo modo.
let sessionId = sessionStorage.getItem('emporio_session') || null;
let showTrace = localStorage.getItem('emporio_trace') === '1';
let busy = false;

const SUGESTOES = [
  'Quais violões vocês têm até R$ 1.000?',
  'Quanto custa o Takamine GD20?',
  'Qual o endereço da loja?',
  'Me arrependi da compra, posso devolver o pedido 7?',
  'Tem alguma promoção rolando?',
  'Vocês vendem cordas e palhetas?'
];

function syncTraceButton() {
  btnTrace.classList.toggle('on', showTrace);
}

// O modelo escreve com ênfase leve em markdown (`**assim**`), que é natural
// num canal de mensagem. Convertemos apenas negrito e itálico — SEMPRE depois
// de escapar o HTML, para que nada vindo do modelo ou do cliente possa injetar
// marcação na página.
function escapeHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

function formatarMensagem(texto) {
  return escapeHtml(texto)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*(?!\s)([^*\n]+?)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
}

function addBubble(text, kind) {
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatarMensagem(text);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function addTrace(trace) {
  if (!trace || !trace.length) return;
  const box = document.createElement('div');
  box.className = 'trace';
  box.innerHTML = trace.map(t => {
    const args = Object.entries(t.argumentos || {})
      .map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ');
    const mark = t.ok ? '✓' : '✗';
    return `${mark} <b>${t.ferramenta}</b>(${args}) <span class="meta">${t.duracao_ms}ms</span>`;
  }).join('<br>');
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row them';
  row.id = 'typing';
  row.innerHTML = '<div class="bubble typing"><i></i><i></i><i></i></div>';
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() {
  document.getElementById('typing')?.remove();
}

function renderChips() {
  chips.innerHTML = '';
  SUGESTOES.forEach(texto => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = texto;
    b.onclick = () => { input.value = texto; form.requestSubmit(); };
    chips.appendChild(b);
  });
}

async function boot() {
  try {
    const health = await fetch('/api/health').then(r => r.json());
    const ok = health.status === 'ok';
    statusEl.innerHTML =
      `<span class="dot ${ok ? '' : 'off'}"></span>` +
      (ok ? `online · ${health.llm.modelo}` : 'configuração incompleta');
    if (!ok) {
      addBubble(
        !health.llm.chave_configurada
          ? 'O agente está sem chave de API. Preencha o arquivo .env (GEMINI_API_KEY) e reinicie o servidor.'
          : 'Os dados ainda não foram carregados. Rode: emporio build',
        'sys'
      );
      return;
    }
  } catch {
    statusEl.innerHTML = '<span class="dot off"></span>servidor indisponível';
    return;
  }

  const saudacao = await fetch('/api/saudacao').then(r => r.json());
  addBubble(saudacao.mensagem, 'them');
  renderChips();
  input.focus();
}

async function enviar(texto) {
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  chips.innerHTML = '';
  addBubble(texto, 'me');
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mensagem: texto,
        session_id: sessionId,
        incluir_trace: showTrace
      })
    });
    hideTyping();
    if (!res.ok) {
      const erro = await res.json().catch(() => ({}));
      addBubble(erro.detail || `Falha na requisição (HTTP ${res.status}).`, 'sys');
      return;
    }
    const data = await res.json();
    sessionId = data.session_id;
    sessionStorage.setItem('emporio_session', sessionId);
    if (showTrace) addTrace(data.trace);
    addBubble(data.resposta, 'them');
  } catch (e) {
    hideTyping();
    addBubble('Não consegui falar com o servidor. Ele ainda está rodando?', 'sys');
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const texto = input.value.trim();
  if (!texto) return;
  input.value = '';
  input.style.height = 'auto';
  enviar(texto);
});

// Enter envia, Shift+Enter quebra linha — convenção de app de mensagem.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

btnTrace.addEventListener('click', () => {
  showTrace = !showTrace;
  localStorage.setItem('emporio_trace', showTrace ? '1' : '0');
  syncTraceButton();
});

btnReset.addEventListener('click', () => {
  sessionId = null;
  sessionStorage.removeItem('emporio_session');
  chat.innerHTML = '';
  boot();
});

syncTraceButton();
boot();
</script>
</body>
</html>
