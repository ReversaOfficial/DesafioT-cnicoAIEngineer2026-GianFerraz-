[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "1.0.0"
description = "Agente de atendimento da Empório da Música (loja de instrumentos musicais, Campo Grande/MS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gian Ferraz" }]

dependencies = [
    "httpx>=0.27,<1.0",      # chamadas HTTP aos provedores de LLM (sem SDK proprietario)
    "pypdf>=4.2",            # extracao do manual de politicas (PDF)
    "typer>=0.12",           # CLI
    "rich>=13.7",            # render do chat/trace no terminal
    "python-dotenv>=1.0",    # carregamento de .env
    "fastapi>=0.110",        # API HTTP + UI web
    "uvicorn>=0.29",         # servidor ASGI
    "tzdata>=2024.1",        # base de timezones (necessaria no Windows)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
emporio = "emporio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Arquivos não-Python lidos em tempo de execução: o schema do banco e a página
# da UI web. Sem isto, uma instalação não-editável sobe sem eles.
[tool.setuptools.package-data]
emporio = ["data/*.sql", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # comprimento de linha fica a cargo do formatador
    "B008",   # `typer.Argument(...)` em default é o idioma da própria Typer
    "SIM905", # a lista de stopwords é um bloco de texto por legibilidade
]
